<div class="oc-topbar">
  <div>
    <div class="oc-eyebrow">Materiais</div>
    <h1 class="oc-title">Novo material</h1>
  </div>
</div>

<div class="oc-form-card">
  <form method="POST" action="{{ url_for('cadastrar') }}">
    <div class="oc-field">
      <label class="oc-label">Nome</label>
      <input class="oc-input" name="nome" maxlength="45" required>
    </div>

    <div class="oc-field-row">
      <div class="oc-field">
        <label class="oc-label">Categoria</label>
        <select class="oc-input js-categoria" name="categoria" required data-mapping='{{ categorias_unidades|tojson }}'>
          <option value="" disabled selected>Selecione...</option>
          {% for cat in categorias_unidades.keys() %}
          <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="oc-field">
        <label class="oc-label">Unidade</label>
        <select class="oc-input js-unidade" name="unidade" required>
          <option value="" disabled selected>Selecione a categoria</option>
        </select>
      </div>
    </div>

    <div class="oc-field-row">
      <div class="oc-field">
        <label class="oc-label">Quantidade</label>
        <input class="oc-input" type="number" name="quantidade" min="0" required>
      </div>
      <div class="oc-field">
        <label class="oc-label">Valor unitário</label>
        <div class="oc-currency">
          <span class="oc-currency-prefix">R$</span>
          <input class="oc-input oc-currency-input js-valor-visual" type="text" inputmode="decimal" placeholder="0,00" maxlength="14" required>
        </div>
        <input type="hidden" name="valor" class="js-valor-hidden">
      </div>
    </div>

    <div class="oc-field">
      <label class="oc-label">Fornecedor</label>
      <input class="oc-input" name="fornecedor" maxlength="45" required>
    </div>

    <div class="oc-form-actions">
      <button class="oc-btn oc-btn-accent">Salvar material</button>
      <a href="{{ url_for('index') }}" class="oc-btn oc-btn-ghost js-modal-cancel">Cancelar</a>
    </div>
  </form>
</div>
