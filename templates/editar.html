{% extends "base.html" %}
{% block title %}Editar material · ObraControl{% endblock %}

{% block content %}

<div class="oc-topbar">
  <div>
    <div class="oc-eyebrow">Materiais</div>
    <h1 class="oc-title">Editar material</h1>
  </div>
</div>

<div class="oc-form-card">
  <form method="POST">
    <div class="oc-field">
      <label class="oc-label">Nome</label>
      <input class="oc-input" name="nome" value="{{ material.nome }}" required>
    </div>

    <div class="oc-field-row">
      <div class="oc-field">
        <label class="oc-label">Categoria</label>
        <input class="oc-input" name="categoria" value="{{ material.categoria }}" required>
      </div>
      <div class="oc-field">
        <label class="oc-label">Unidade</label>
        <input class="oc-input" name="unidade" value="{{ material.unidade }}" required>
      </div>
    </div>

    <div class="oc-field-row">
      <div class="oc-field">
        <label class="oc-label">Quantidade</label>
        <input class="oc-input" type="number" name="quantidade" value="{{ material.quantidade }}" required>
      </div>
      <div class="oc-field">
        <label class="oc-label">Valor unitário (R$)</label>
        <input class="oc-input" type="number" step="0.01" name="valor" value="{{ material.valor }}" required>
      </div>
    </div>

    <div class="oc-field">
      <label class="oc-label">Fornecedor</label>
      <input class="oc-input" name="fornecedor" value="{{ material.fornecedor }}" required>
    </div>

    <div class="oc-form-actions">
      <button class="oc-btn oc-btn-accent">Salvar alterações</button>
      <a href="{{ url_for('index') }}" class="oc-btn oc-btn-ghost">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
